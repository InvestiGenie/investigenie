name: Playground AI evaluation

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: Ollama model tag or registered model selector
        required: true
        default: qwen2.5:1.5b
        type: string

permissions:
  contents: read

concurrency:
  group: playground-eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PLAYGROUND_AI_CONTEXT: "16384"
      PLAYGROUND_CLICKHOUSE: "off"
      PLAYGROUND_EVENTS: "10000"
      AI_PROBE_TIMEOUT_SECONDS: "600"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start playground and provision model
        env:
          MODEL: ${{ inputs.model || 'qwen2.5:1.5b' }}
        run: ./playground/playground.sh up --ai docker --models "$MODEL"
      - name: Evaluate investigations
        env:
          MODEL: ${{ inputs.model || 'qwen2.5:1.5b' }}
        run: |
          ./playground/playground.sh eval \
            --model "$MODEL" \
            --ai-timeout 600 \
            --budget 1200 \
            --max-minutes 30 \
            --max-continues 2 \
            --fail-on pipeline-error \
            --summary-file /reports/summary.md
      - name: Capture failure diagnostics
        if: failure()
        run: |
          mkdir -p playground/reports
          docker compose -f playground/compose.yaml --profile ollama logs \
            --no-color --tail 200 investigenie ollama > playground/reports/services.log
      - name: Publish evaluation summary
        if: always()
        shell: bash
        run: |
          if [[ -f playground/reports/summary.md ]]; then
            cat playground/reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Evaluation summary was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playground-ai-evaluation
          path: |
            playground/reports/*.json
            playground/reports/services.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Stop playground
        if: always()
        run: ./playground/playground.sh down
