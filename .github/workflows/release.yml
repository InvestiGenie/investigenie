name: Build & Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. 0.1.3-alpha)'
        required: true
        default: '0.1.3-alpha'

permissions:
  contents: write

# GitHub can deliver the same tag push twice; only the newest run per tag survives.
concurrency:
  group: release-${{ github.event.inputs.tag_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Determine Tag Name
        id: vars
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.vars.outputs.tag }}

      - name: Publish approved release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          notes_file=".github/release-notes/$TAG.md"
          if [ ! -s "$notes_file" ]; then
            echo "Missing approved release notes: $notes_file" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes_file"
            exit 0
          fi
          flags=()
          case "$TAG" in *alpha*|*beta*|*rc*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file "$notes_file" "${flags[@]}"

  build:
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: amd64
            target: x86_64-unknown-linux-gnu
            binary_name: investigenie-api
            ext: ""
          - os: macos-14
            platform: darwin
            arch: arm64
            target: aarch64-apple-darwin
            binary_name: investigenie-api
            ext: ""
          - os: windows-latest
            platform: windows
            arch: amd64
            target: x86_64-pc-windows-msvc
            binary_name: investigenie-api.exe
            ext: ".exe"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - name: Determine Tag Name
        id: vars
        shell: bash
        run: echo "tag=${{ needs.prepare.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Web UI
        run: |
          npm ci
          npm run build:web

      - name: Build Backend
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p investigenie-api

      - name: Package Bundle (Unix & macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          DIST_DIR="dist_pkg/investigenie"
          mkdir -p "$DIST_DIR/web"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$DIST_DIR/"
          cp -r frontend/dist/* "$DIST_DIR/web/"
          cp .env.example README.md LICENSE "$DIST_DIR/"
          cd dist_pkg
          zip -r "../investigenie-${{ matrix.platform }}-${{ matrix.arch }}-${TAG}.zip" investigenie
          cd ..

      - name: Package Bundle (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $tag = "${{ steps.vars.outputs.tag }}"
          $distDir = "dist_pkg/investigenie"
          New-Item -ItemType Directory -Force -Path "$distDir/web" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$distDir/"
          Copy-Item -Recurse "frontend/dist/*" "$distDir/web/"
          Copy-Item ".env.example", "README.md", "LICENSE" "$distDir/"
          Compress-Archive -Path "dist_pkg/investigenie" -DestinationPath "investigenie-${{ matrix.platform }}-${{ matrix.arch }}-$tag.zip" -Force

      - name: Upload Release Asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: gh release upload "$TAG" "investigenie-${{ matrix.platform }}-${{ matrix.arch }}-${TAG}.zip" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: investigenie-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.vars.outputs.tag }}
          path: investigenie-${{ matrix.platform }}-${{ matrix.arch }}-*.zip

  docker:
    name: Docker image
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - name: Image name and tags
        id: image
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:$TAG"
          case "$TAG" in *alpha*|*beta*|*rc*) ;; *) tags="$tags,$image:latest" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=InvestiGenie
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.tag }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
