[package]
name = "investigenie-api"
version.workspace = true
edition.workspace = true

[dependencies]
axum = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
fs2 = "0.4"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sqlparser = { version = "0.63", default-features = false, features = ["recursive-protection", "std"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros", "json"] }
uuid = { version = "1", features = ["v4"] }
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
url = "2"
yup-oauth2 = { version = "12", default-features = false, features = ["hyper-rustls", "ring", "service-account"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
