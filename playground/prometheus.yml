global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: mimir
    static_configs:
      - targets: [mimir:9009]

  - job_name: seeder
    static_configs:
      - targets: [seeder:8000]

remote_write:
  - url: http://mimir:9009/api/v1/push
