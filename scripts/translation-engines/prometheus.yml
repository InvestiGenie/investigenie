# Scrapes the translation matrix fixture every second and forwards it to Mimir.
global:
  scrape_interval: 1s

scrape_configs:
  - job_name: translation-matrix
    metrics_path: /metrics
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: [ig-te-fixture:8000]

remote_write:
  - url: http://ig-te-mimir:9009/api/v1/push
